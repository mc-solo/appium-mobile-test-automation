[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    smoke: quick launch checks
    navigation: ApiDemos navigation checks
    input: text input checks
    gestures: swipe, long press, scroll and tap checks
    app_start: app install/start and deep link checks
